[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastlimit"
version = "0.1.0"
description = "Production-ready rate limiting for ASGI apps"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fakeredis>=2.0",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"